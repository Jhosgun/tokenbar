name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode disponible
        run: |
          # No se fija una versión concreta: los runners rotan y la ruta cambia.
          # Basta con que sea 16 o superior, que es lo que pide Swift 6.
          xcodebuild -version
          sudo xcode-select -p

      - name: Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project TokenBar.xcodeproj -scheme TokenBar \
            -destination 'platform=macOS' -derivedDataPath build \
            | tee test.log | grep -E "Test run with|error:|✘|recorded an issue|\*\* TEST" || true
          if ! grep -q "TEST SUCCEEDED" test.log; then
            echo "::group::Fallos detallados"
            grep -E "✘|recorded an issue|error:" test.log | head -50
            echo "::endgroup::"
            exit 1
          fi

      - name: Guardar el log de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

      - name: Build Release
        run: |
          xcodebuild -project TokenBar.xcodeproj -scheme TokenBar \
            -configuration Release -derivedDataPath build build | tail -1
